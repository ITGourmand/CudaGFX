name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  # The whole test suite (unit tests, diagnostics, goldens, CPU backend, sanitizers, fuzzing...). The shaders are
  # validated as GLSL with glslangValidator and the runtime is type-checked against the real bgfx headers; the tests
  # that need a GPU are reported as skipped (a runner has none).
  linux:
    name: Linux tests (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake glslang-tools shellcheck clang g++-mingw-w64-x86-64

      - uses: ./.github/actions/bgfx-headers

      # CXX compiles the code the tool generates (the tool itself is built by the Makefile with g++).
      - name: make test
        env:
          CXX: ${{ matrix.cxx }}
        run: make test

      - name: CMake build and tests (unit, runtime, integration, install + find_package)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCUDAGFX_BUILD_TESTS=ON
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure -E suite

  # The older toolchain of Ubuntu 22.04 (GCC 11), the one that builds the Linux release.
  linux-gcc11:
    name: Linux tests (GCC 11, Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools shellcheck
      - uses: ./.github/actions/bgfx-headers
      - name: make test
        run: make test

  # The fully static Linux binary that the release ships: it must build, be static, and run.
  linux-static:
    name: Linux static binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make linux LDFLAGS="-static -lpthread"
      - name: Check that it is static and transpiles an example
        run: |
          file .build/linux/bin/cudagfx
          ldd .build/linux/bin/cudagfx 2>&1 | grep -q "not a dynamic executable"
          mkdir out
          .build/linux/bin/cudagfx examples/saxpy/saxpy.cu -o out/saxpy_gen.cpp --shader-dir out --emit-cpu
          ls out

  # The CPU backend with the OS-thread executor only (the one Windows and macOS use).
  threads-executor:
    name: CPU backend, OS-thread executor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make linux
      - name: Run tests/cpu with CUDAGFX_CPU_THREADS_ONLY
        run: |
          for t in cpu_reduce cpu_features cpu_constants; do
            ./.build/linux/bin/cudagfx "tests/cpu/$t.cu" -o "/tmp/$t.cpp" --emit-cpu --shader-dir /tmp
            g++ -std=c++17 -O1 -DCUDAGFX_NO_BGFX -DCUDAGFX_CPU_THREADS_ONLY -Iinclude "/tmp/$t.cpp" -o "/tmp/$t" -pthread
            "/tmp/$t"
          done

  # ---------------------------------------------------------------------------------------------------------------
  # Windows: cross-compiled with mingw on Linux, then the .exe is run on a real Windows runner.
  windows-build:
    name: Windows build (mingw cross-compiler)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
      - run: make windows
      - uses: actions/upload-artifact@v4
        with:
          name: cudagfx-windows-exe
          path: .build/windows/bin/cudagfx.exe
          if-no-files-found: error

  windows-smoke:
    name: Windows run (cudagfx.exe on windows-latest)
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cudagfx-windows-exe
          path: bin
      - name: Transpile an example with the Windows binary
        shell: bash
        run: |
          ./bin/cudagfx.exe --help > help.txt
          head -n 5 help.txt
          mkdir out
          ./bin/cudagfx.exe examples/saxpy/saxpy.cu -o out/saxpy_gen.cpp --shader-dir out --emit-cpu
          ls out
          test -f out/saxpy_gen.cpp
          test -f out/saxpy_gen_kernels.h
          test -f out/saxpy_gen_cpu.h
          ls out/cs_saxpy_*.sc

  # Experimental: compile and run a CPU-backend program with the MinGW of the Windows runner (its thread model decides
  # whether <thread> exists). A failure here is reported but does not fail the workflow.
  windows-cpu-backend:
    name: Windows CPU backend (experimental)
    needs: windows-build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cudagfx-windows-exe
          path: bin
      - name: Compile and run tests/cpu/cpu_reduce.cu
        shell: bash
        run: |
          g++ --version | head -n 1
          mkdir out
          ./bin/cudagfx.exe tests/cpu/cpu_reduce.cu -o out/cpu_reduce.cpp --shader-dir out --emit-cpu
          g++ -std=c++17 -O1 -DCUDAGFX_NO_BGFX -Iinclude out/cpu_reduce.cpp -o out/cpu_reduce.exe
          ./out/cpu_reduce.exe
