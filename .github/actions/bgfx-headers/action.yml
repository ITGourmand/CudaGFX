name: bgfx headers
description: >
  Puts the headers of bgfx, bx and bimg and the shader includes of bgfx in .deps/bgfx/include, where tests/run_tests.sh
  looks for them. That is enough to type-check the runtime against the real bgfx API and to validate the generated
  shaders as GLSL; it does not build shaderc (see the "real-shaderc" job of ci.yml for that).

runs:
  using: composite
  steps:
    - name: Fetch bgfx, bx and bimg at the pinned revisions
      shell: bash
      run: .github/scripts/fetch-bgfx-headers.sh .deps/bgfx
